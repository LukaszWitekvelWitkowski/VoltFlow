services:
  database:
    image: postgres:16
    container_name: portfolio_db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_ADMIN_USER}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - ${DB_STORAGE_PATH}:/var/lib/postgresql/data
      # Ważne: upewnij się, że plik init-db.sql istnieje w tym samym folderze
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always
    ports:
      - "8025:8025" 
      - "1025:1025" 
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db 
    volumes:
      - ./mailpit-data:/data